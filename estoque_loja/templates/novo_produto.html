{% extends "base.html" %}

{% block title %}Novo Produto - Gestão de Estoque{% endblock %}

{% block content %}
<div class="centered-container">
    <div class="formulario-wrapper">
        <h2>Cadastrar Novo Produto</h2>
        
        <form method="POST" class="formulario">
            <div class="grid-2">
                <div>
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" name="codigo" placeholder="EX: PRD-001" required>
                </div>
                <div>
                    <label for="nome_modelo">Modelo</label>
                    <input type="text" id="nome_modelo" name="nome_modelo" placeholder="Ex: Camiseta Básica" required>
                </div>
            </div>

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" placeholder="Ex: Vestuário" required>

            <div class="grid-2">
                <div>
                    <label for="cor">Cor</label>
                    <input type="text" id="cor" name="cor" placeholder="Ex: Azul" required>
                </div>
                <div>
                    <label for="tamanho">Tamanho</label>
                    <input type="text" id="tamanho" name="tamanho" placeholder="Ex: M" required>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label for="quantidade">Quantidade Inicial</label>
                    <input type="number" id="quantidade" name="quantidade" min="0" value="0" required>
                </div>
                <div>
                    <label for="preco">Preço Unitário (R$)</label>
                    <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="0,00" required>
                </div>
            </div>

            <label for="fornecedor">Fornecedor</label>
            <input type="text" id="fornecedor" name="fornecedor" placeholder="Nome do fornecedor (opcional)">

            <div class="acoes-formulario mt-2">
                <button type="submit" class="botao botao-primary" style="flex: 2;">Salvar Produto</button>
                <a href="{{ url_for('index') }}" class="botao botao-secundario" style="flex: 1;">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
