{% extends "base.html" %}

{% block title %}Editar Produto - Gestão de Estoque{% endblock %}

{% block content %}
<div class="centered-container">
    <div class="formulario-wrapper">
        <h2>Editar Produto</h2>
        
        <form method="POST" class="formulario">
            <div class="grid-2">
                <div>
                    <label>Código</label>
                    <input type="text" name="codigo" value="{{ produto.codigo }}" required>
                </div>
                <div>
                    <label>Modelo</label>
                    <input type="text" name="nome_modelo" value="{{ produto.nome_modelo }}" required>
                </div>
            </div>

            <label>Categoria</label>
            <input type="text" name="categoria" value="{{ produto.categoria }}" required>

            <div class="grid-2">
                <div>
                    <label>Cor</label>
                    <input type="text" name="cor" value="{{ produto.cor }}" required>
                </div>
                <div>
                    <label>Tamanho</label>
                    <input type="text" name="tamanho" value="{{ produto.tamanho }}" required>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label>Quantidade Atual</label>
                    <input type="number" name="quantidade" value="{{ produto.quantidade }}" required>
                </div>
                <div>
                    <label>Preço Unitário (R$)</label>
                    <input type="number" step="0.01" name="preco" value="{{ produto.preco }}" required>
                </div>
            </div>

            <label>Fornecedor</label>
            <input type="text" name="fornecedor" value="{{ produto.fornecedor }}">

            <div class="acoes-formulario mt-2">
                <button type="submit" class="botao botao-primary" style="flex: 2;">Salvar Alterações</button>
                <a href="{{ url_for('index') }}" class="botao botao-secundario" style="flex: 1;">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
