{% extends "base.html" %}

{% block title %}Editar Produto{% endblock %}

{% block content %}
<h2>Editar Produto</h2>

<form method="POST" class="formulario">
    <label>Código</label>
    <input type="text" name="codigo" value="{{ produto.codigo }}" required>

    <label>Modelo</label>
    <input type="text" name="nome_modelo" value="{{ produto.nome_modelo }}" required>

    <label>Categoria</label>
    <input type="text" name="categoria" value="{{ produto.categoria }}" required>

    <label>Cor</label>
    <input type="text" name="cor" value="{{ produto.cor }}" required>

    <label>Tamanho</label>
    <input type="text" name="tamanho" value="{{ produto.tamanho }}" required>

    <label>Quantidade</label>
    <input type="number" name="quantidade" value="{{ produto.quantidade }}" required>

    <label>Preço</label>
    <input type="number" step="0.01" name="preco" value="{{ produto.preco }}" required>

    <label>Fornecedor</label>
    <input type="text" name="fornecedor" value="{{ produto.fornecedor }}">

    <div class="acoes-formulario">
        <button type="submit" class="botao">Salvar</button>
        <a href="{{ url_for('index') }}" class="botao botao-secundario">Cancelar</a>
    </div>
</form>
{% endblock %}
